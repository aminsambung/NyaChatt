function showError(id,e){
const map={"auth/invalid-credential":"Identitas atau kata sandi salah.","auth/user-not-found":"Akun tidak ditemukan.","auth/wrong-password":"Kata sandi salah.","auth/email-already-in-use":"Email sudah terdaftar.","auth/weak-password":"Kata sandi minimal 6 karakter.","auth/invalid-email":"Format email/identitas tidak valid."};
$(id).textContent=map[e?.code]||e?.message||"Terjadi kesalahan.";
}

function generateBbmPin(uid){
  return uid.substring(0, 8).toUpperCase();
}

async function ensureProfile(user, customName="", customPhone=""){
const ref=doc(db,"users",user.uid),snap=await getDoc(ref);
if(!snap.exists()){
  await setDoc(ref,{
    uid:user.uid,
    bbmPin: generateBbmPin(user.uid),
    email:user.email||"",
    displayName:customName || (user.email||"Pengguna").split("@")[0],
    phone:customPhone || "",
    statusText: "Available",
    createdAt:serverTimestamp()
  });
} else {
  const data = snap.data();
  if(!data.bbmPin){
    await updateDoc(ref, { bbmPin: generateBbmPin(user.uid) });
  }
}
}

$("toggleModeBtn").onclick=()=>{
isRegisterMode=!isRegisterMode;
$("authError").textContent="";
if(isRegisterMode){
  $("authScreenTitle").textContent="Buat Akun Baru";

  $("mainActionBtn").textContent="Daftar";
  $("toggleModeBtn").textContent="Sudah punya akun? Masuk";
  $("loginInput").placeholder="Username, Email, atau No. HP";
}else{
  $("authScreenTitle").textContent="NyaChatt BBM Edition";
  $("authScreenDesc").textContent="Masuk menggunakan Username, Email, atau No. HP kamu.";

function isEmail(text){
return text.includes("@") && text.includes(".");
}

$("mainActionBtn").onclick=async()=>{
$("authError").textContent="";
const inputVal=$("loginInput").value.trim();
const pass=$("password").value;

if(!inputVal || !pass){
  $("authError").textContent="Semua kolom wajib diisi!";
  return;
}

try{
  let targetEmail = inputVal;

  if(isRegisterMode){
    if(!isEmail(inputVal)){
      targetEmail = inputVal.toLowerCase().replace(/[^a-z0-9]/g, '') + "@nyachatt.app";
    }
    const c = await createUserWithEmailAndPassword(auth, targetEmail, pass);
    await ensureProfile(c.user, isEmail(inputVal) ? "" : inputVal, isEmail(inputVal) ? "" : isEmail(inputVal) ? "" : inputVal);
  } else {
    if(!isEmail(inputVal)){
      const usersRef = collection(db, "users");
      const qName = query(usersRef, where("displayName", "==", inputVal));
      const snapName = await getDocs(qName);
      
      if(!snapName.empty){
        targetEmail = snapName.docs[0].data().email;
      } else {
        const qPhone = query(usersRef, where("phone", "==", inputVal));
        const snapPhone = await getDocs(qPhone);
        if(!snapPhone.empty){
          targetEmail = snapPhone.docs[0].data().email;
        } else {
          throw {code: "auth/user-not-found"};
        }
      }
    }
    await signInWithEmailAndPassword(auth, targetEmail, pass);
  }
}catch(e){
  showError("authError",e);
}
};

document.querySelectorAll(".nav-tab").forEach(tab=>{
tab.onclick=()=>{

  document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));

  } else if(tab.dataset.target === "tabFeeds"){

    loadFeeds();
  }
};
});

async function loadActiveChats(){
const box=$("chatsList");
box.innerHTML='<div class="empty">Memuat percakapan...</div>';
try{
  const snapContacts = await getDocs(collection(db, "users", currentUser.uid, "contacts"));
  let activeChats = [];

  for(const cDoc of snapContacts.docs){
    const cData = cDoc.data();
    const usersRef = collection(db, "users");
    let targetUserId = null;

    const qPin = query(usersRef, where("bbmPin", "==", cData.bbmPin));
    const sPin = await getDocs(qPin);
    if(!sPin.empty){
      targetUserId = sPin.docs[0].id;
    }

    if(targetUserId){
      const id = conversationId(currentUser.uid, targetUserId);
      const convSnap = await getDoc(doc(db, "conversations", id));
      if(convSnap.exists()){
        const msgQuery = query(collection(db, "conversations", id, "messages"), orderBy("createdAt", "desc"), limit(1));
        const msgSnap = await getDocs(msgQuery);

        if(!msgSnap.empty){
          const lastMsgData = msgSnap.docs[0].data();
          let unreadCount = 0;
          const allMsgsSnap = await getDocs(collection(db, "conversations", id, "messages"));
          allMsgsSnap.forEach(mDoc => {
            const mData = mDoc.data();
            if(mData.senderId !== currentUser.uid && mData.read !== true){
              unreadCount++;
            }
          });

          activeChats.push({
            userId: targetUserId,
            displayName: cData.name,
            pin: cData.bbmPin,
            lastMessage: lastMsgData.text || "Lampiran",
            unreadCount: unreadCount
          });
        }
      }
    }
  }

  if(activeChats.length === 0){
    box.innerHTML=`<div class="empty">Belum ada percakapan aktif.<br>Undang kontak via PIN terlebih dahulu untuk mulai chat.</div>`;
    return;
  }

  box.innerHTML="";
  for(const chat of activeChats){
    const item = document.createElement("div");
    item.className = "chat-item";

    const av = document.createElement("div");
    av.className = "chat-avatar";
    av.textContent = chat.displayName.charAt(0).toUpperCase();

    const info = document.createElement("div");
    info.className = "chat-info";

    const nameRow = document.createElement("div");
    nameRow.className = "chat-name-row";

    const nameEl = document.createElement("div");
    nameEl.className = "chat-contact-name";
    nameEl.textContent = chat.displayName;
    nameRow.appendChild(nameEl);

    if(chat.unreadCount > 0){
      const badge = document.createElement("span");
      badge.className = "unread-badge";
      badge.textContent = chat.unreadCount;
      nameRow.appendChild(badge);
    }

    info.appendChild(nameRow);

    const snippet = document.createElement("div");
    snippet.className = "chat-snippet";
    snippet.textContent = chat.lastMessage;
    info.appendChild(snippet);

    item.append(av, info);
    item.onclick = () => openChat({ id: chat.userId, displayName: chat.displayName, pin: chat.pin });
    box.appendChild(item);
  }
}catch(e){
  box.innerHTML=`<div class="empty">Belum ada percakapan aktif.</div>`;
}
}

const openModal=(contactId = null, currentName = "", currentPin = "")=>{
  editingContactId = contactId;
  $("contactModal").classList.remove("hidden");
  $("contactError").textContent="";
  if(contactId){
    $("modalTitleText").textContent="Edit Kontak";
    $("newContactName").value = currentName;
    $("newContactPin").value = currentPin;
  } else {
    $("modalTitleText").textContent="Undang Kontak (Invite PIN)";
    $("newContactName").value = "";
    $("newContactPin").value = "";
  }
};
const closeModal=()=>$("contactModal").classList.add("hidden");

$("openAddContactModal").onclick=()=>openModal();
$("cancelModalBtn").onclick=closeModal;
$("fabNewChatBtn").onclick=()=>document.querySelector("[data-target='tabContacts']").click();

$("saveContactBtn").onclick=async()=>{
$("contactError").textContent="";
const name=$("newContactName").value.trim();
const pinInput=$("newContactPin").value.trim().toUpperCase();

if(!name || !pinInput){
  $("contactError").textContent="Nama dan PIN BBM wajib diisi!";
  return;
}

try{
  const usersRef = collection(db, "users");
  const qPin = query(usersRef, where("bbmPin", "==", pinInput));
  const snapPin = await getDocs(qPin);

  if(snapPin.empty){
    $("contactError").textContent="PIN BBM tidak ditemukan / tidak terdaftar!";
    return;
  }

  const targetUserData = snapPin.docs[0].data();
  if(targetUserData.uid === currentUser.uid){
    $("contactError").textContent="Tidak dapat menambahkan PIN Anda sendiri!";
    return;
  }

  if(editingContactId){
    await updateDoc(doc(db, "users", currentUser.uid, "contacts", editingContactId), { name, bbmPin: pinInput });
  } else {
    await addDoc(collection(db,"users",currentUser.uid,"contacts"),{ name, bbmPin: pinInput, createdAt:serverTimestamp() });
  }
  closeModal();
  await loadContactsTab();
}catch(e){
  $("contactError").textContent="Gagal menyimpan: "+e.message;
}
};

async function deleteContact(contactId, event){
  event.stopPropagation();
  if(confirm("Hapus kontak ini?")){
    try {
      await deleteDoc(doc(db, "users", currentUser.uid, "contacts", contactId));
      await loadContactsTab();
    }catch(e){ alert("Gagal menghapus"); }
  }
}

async function loadContactsTab(){
const box=$("contactsTabList");
box.innerHTML='<div class="empty">Memuat kontak...</div>';
try{
  const snapContacts = await getDocs(collection(db, "users", currentUser.uid, "contacts"));
  
  if(snapContacts.empty){
    box.innerHTML='<div class="empty">Belum ada kontak tersimpan.<br>Ketuk "Undang Kontak" di atas untuk menambahkan teman via PIN.</div>';
    return;
  }

  box.innerHTML="";
  for(const d of snapContacts.docs){
    const c = d.data();
    const contactId = d.id;
    const nameStr = c.name;
    const pinStr = c.bbmPin;

    const usersRef = collection(db, "users");
    let targetUid = null;
    const qPin = query(usersRef, where("bbmPin", "==", pinStr));
    const sPin = await getDocs(qPin);
    if(!sPin.empty){
      targetUid = sPin.docs[0].id;
    }

    const item=document.createElement("div");
    item.className="chat-item";
    
    const av=document.createElement("div");
    av.className="chat-avatar";
    av.textContent=nameStr.charAt(0).toUpperCase();
    
    const info=document.createElement("div");
    info.className="chat-info";
    
    const nameRow=document.createElement("div");
    nameRow.className="chat-name-row";
    
    const nameEl=document.createElement("div");
    nameEl.className="chat-contact-name";
    nameEl.textContent=nameStr;
    nameRow.appendChild(nameEl);
    
    const actionsDiv = document.createElement("div");
    actionsDiv.className = "contact-actions";
    
    const editBtn = document.createElement("button");
    editBtn.className = "action-icon-btn";
    editBtn.innerHTML = "✏️";
    editBtn.onclick = (e)=>{ e.stopPropagation(); openModal(contactId, nameStr, pinStr); };

    const delBtn = document.createElement("button");
    delBtn.className = "action-icon-btn";
    delBtn.innerHTML = "🗑️";
    delBtn.onclick = (e)=>deleteContact(contactId, e);

    actionsDiv.append(editBtn, delBtn);
    nameRow.appendChild(actionsDiv);
    info.appendChild(nameRow);
    
    const snippet=document.createElement("div");
    snippet.className="chat-snippet";
    snippet.textContent = "PIN: " + pinStr + (targetUid ? "" : " (Pengguna tidak aktif)");
    info.appendChild(snippet);
    
    item.append(av, info);
    
    if(targetUid){
      item.onclick=()=>openChat({id: targetUid, displayName: nameStr, pin: pinStr});
    } else {
      item.onclick=()=>alert("Pemilik PIN ini belum terdaftar di sistem.");
    }

    box.appendChild(item);
  }
}catch(e){
  box.innerHTML='<div class="empty">Gagal memuat kontak.</div>';
}
}

    const d = await getDoc(doc(db, "users", currentUser.uid));

async function loadFeeds(){
  const box = $("feedsList");
  try{
    const snapContacts = await getDocs(collection(db, "users", currentUser.uid, "contacts"));
    box.innerHTML="";
    let count = 0;

    for(const cDoc of snapContacts.docs){
      const cData = cDoc.data();
      const usersRef = collection(db, "users");
      const qPin = query(usersRef, where("bbmPin", "==", cData.bbmPin));
      const sPin = await getDocs(qPin);

      if(!sPin.empty){
        const targetUid = sPin.docs[0].id;
        const targetUser = sPin.docs[0].data();

        if(targetUser && targetUser.statusText){
          count++;
          const item = document.createElement("div");
          item.className="chat-item";
          
          const av=document.createElement("div");
          av.className="chat-avatar";
          av.textContent=cData.name.charAt(0).toUpperCase();

          const info=document.createElement("div");
          info.className="chat-info";

          const nameEl=document.createElement("div");
          nameEl.className="chat-contact-name";
          nameEl.textContent=cData.name;
          info.appendChild(nameEl);

          const snippet=document.createElement("div");
          snippet.className="chat-snippet";
          snippet.textContent=targetUser.statusText;
          info.appendChild(snippet);

          item.append(av, info);
          item.onclick=()=>openChat({id: targetUid, displayName: cData.name, pin: cData.bbmPin});
          box.appendChild(item);
        }
      }
    }

    if(count === 0) box.innerHTML='<div class="empty">Belum ada pembaruan status dari kontak Anda.</div>';
  }catch(e){ box.innerHTML='<div class="empty">Gagal memuat feeds.</div>'; }
}

function conversationId(a,b){return[a,b].sort().join("_")}

async function openChat(person){
selectedPerson=person;
$("mainAppView").classList.add("hidden");
$("chatRoomView").classList.remove("hidden");
$("chatTitle").textContent=person.displayName||"Chat";
$("messages").innerHTML='<div class="empty">Memuat pesan...</div>';

if(stopMessages)stopMessages();
let lastMessageCount = 0; // Untuk mendeteksi pesan baru masuk secara real-time
const id=conversationId(currentUser.uid,person.id),ref=doc(db,"conversations",id);

try{
await setDoc(ref,{members:[currentUser.uid,person.id].sort()},{merge:true});
const q=query(collection(db,"conversations",id,"messages"),orderBy("createdAt","asc"));

stopMessages=onSnapshot(q,result=>{
const area=$("messages");area.innerHTML="";
if(result.empty){area.innerHTML='<div class="empty">Mulai percakapan dengan PING! atau pesan teks.</div>';return}

let docsArray = result.docs;
// Periksa apakah ada pesan masuk baru dari lawan jenis/lawan bicara (sender bukan kita)
if(docsArray.length > lastMessageCount && lastMessageCount > 0){
  const latestMsg = docsArray[docsArray.length - 1].data();
  if(latestMsg.senderId !== currentUser.uid && latestMsg.text === "⚡ PING! ⚡"){
    if(navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
  }
}
lastMessageCount = docsArray.length;

result.forEach(d=>{
const m=d.data();
const isMine=(m.senderId===currentUser.uid);

const row=document.createElement("div");
row.className="msg-row"+(isMine?" mine":"");

const bubble=document.createElement("div");
bubble.className="bubble "+(isMine?"mine":"other");

const body=document.createElement("div");
body.className="bubble-text";
body.textContent=m.text||"";
bubble.appendChild(body);

const footer=document.createElement("div");
footer.className="bubble-footer";

if(m.createdAt?.toDate){
  const t=m.createdAt.toDate();
  const timeSpan=document.createElement("span");
  timeSpan.className="time";
  timeSpan.textContent=t.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
  footer.appendChild(timeSpan);
}

if(isMine){
  const check=document.createElement("span");
  const isRead=m.read === true;
  check.className="bbm-check" + (isRead ? " read" : "");
  check.textContent=isRead ? "✓✓" : "✓";
  footer.appendChild(check);
}

bubble.appendChild(footer);
row.appendChild(bubble);
area.appendChild(row);

if(!isMine && m.read !== true){
  updateDoc(doc(db,"conversations",id,"messages",d.id), { read: true }).catch(()=>{});
}
});
area.scrollTop=area.scrollHeight;
},e=>showError("appError",e));
}catch(e){showError("appError",e)}
}

$("backToList").onclick=()=>{
if(stopMessages)stopMessages();
$("chatRoomView").classList.add("hidden");
$("mainAppView").classList.remove("hidden");
loadActiveChats();
};

// Tombol PING! sekarang hanya mengirim pesan ke database, HP pengirim tidak bergetar
$("pingBtn").onclick=async()=>{
  if(!currentUser || !selectedPerson) return;
  try{
    const id=conversationId(currentUser.uid,selectedPerson.id);
    await addDoc(collection(db,"conversations",id,"messages"),{
      senderId:currentUser.uid,
      text: "⚡ PING! ⚡",
      read:false,
      createdAt:serverTimestamp()
    });
  }catch(e){}
};

$("sendForm").onsubmit=async event=>{
event.preventDefault();
const text=$("messageInput").value.trim();
if(!text||!currentUser||!selectedPerson)return;
$("sendBtn").disabled=true;
try{
  const id=conversationId(currentUser.uid,selectedPerson.id);
  await addDoc(collection(db,"conversations",id,"messages"),{
    senderId:currentUser.uid,
    text,
    read:false,
    createdAt:serverTimestamp()
  });
  $("messageInput").value="";
}catch(e){
  showError("appError",e);
}finally{
  $("sendBtn").disabled=false;
}
};
