<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NyaChatt</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#e5ddd5;min-height:100vh}
.app{max-width:500px;height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column}
.header{background:#075e54;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-size:21px;font-weight:bold;gap:10px}
.header-left{display:flex;align-items:center;gap:10px;min-width:0}
.header-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout,.back{background:#128c7e;color:#fff;border:0;padding:10px;border-radius:8px}
.back{font-size:18px}
.login-box{margin:auto;padding:25px;width:100%}
.login-box h1{text-align:center;color:#075e54;margin-bottom:10px}
.subtitle{text-align:center;color:#777;margin-bottom:25px}
.login-box input{width:100%;padding:14px;margin-bottom:15px;border:1px solid #ccc;border-radius:10px;font-size:16px}
.primary{width:100%;padding:14px;border:0;border-radius:10px;background:#128c7e;color:#fff;font-size:17px;margin-bottom:12px}
.switch{text-align:center;margin-top:10px;color:#075e54;cursor:pointer}
.error{color:#c00;text-align:center;margin:10px 0;font-size:13px}
.hidden{display:none!important}
#chatPage{height:100%;min-height:0;display:flex;flex-direction:column}
#peoplePage{flex:1;min-height:0;display:flex;flex-direction:column}
.people-tools{padding:12px;background:#eee;display:flex;gap:8px}
.people-tools input{flex:1;min-width:0;padding:12px;border:1px solid #ddd;border-radius:20px;font-size:15px}
.people-tools button{border:0;border-radius:20px;padding:0 12px;background:#128c7e;color:white}
.people-list{overflow-y:auto;flex:1;background:#fff}
.person{width:100%;border:0;border-bottom:1px solid #eee;background:white;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;color:#222}
.avatar{width:44px;height:44px;border-radius:50%;background:#d9fdd3;color:#075e54;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;flex-shrink:0}
.person-info{min-width:0}
.person-name{font-weight:bold;margin-bottom:4px}
.person-email{font-size:12px;color:#777;overflow:hidden;text-overflow:ellipsis}
.empty{padding:20px;text-align:center;color:#777;font-size:14px}
.chat-info{padding:10px 12px;background:#eee;font-size:13px}
.messages{flex:1;min-height:0;overflow-y:auto;padding:15px;background:#efe7dd;display:flex;flex-direction:column;gap:10px}
.message{max-width:80%;padding:10px 12px;border-radius:10px;background:white;align-self:flex-start;overflow-wrap:anywhere;box-shadow:0 1px 2px #0002}
.message.mine{background:#d9fdd3;align-self:flex-end}
.message-text{font-size:15px;white-space:pre-wrap}
.time{text-align:right;color:#777;font-size:10px;margin-top:5px}
.bottom{padding:10px;background:#f0f0f0;display:flex;gap:8px}
.bottom input{flex:1;min-width:0;padding:13px;border:0;border-radius:25px;outline:none;font-size:16px}
.send{width:48px;height:48px;border:0;border-radius:50%;background:#128c7e;color:white;font-size:20px}
.status{text-align:center;color:#777;font-size:13px;padding:6px}
</style>
</head>
<body>
<div class="app">
  <div id="authPage" class="login-box">
    <h1>NyaChatt 💬</h1>
    <p class="subtitle" id="formTitle">Silakan login ke akun kamu</p>
    <input type="text" id="name" placeholder="Nama kamu" class="hidden" maxlength="40">
    <input type="email" id="email" placeholder="Email" autocomplete="email">
    <input type="password" id="password" placeholder="Kata sandi" autocomplete="current-password">
    <p id="error" class="error"></p>
    <button id="submitBtn" class="primary">Login</button>
    <p id="switchBtn" class="switch">Belum punya akun? Daftar</p>
  </div>

  <div id="chatPage" class="hidden">
    <div class="header">
      <div class="header-left"><button id="backBtn" class="back hidden" type="button" aria-label="Kembali">‹</button><span class="header-title" id="headerTitle">NyaChatt 💬</span></div>
      <button id="logoutBtn" class="logout">Logout</button>
    </div>

    <div id="peoplePage">
      <div class="chat-info">Pilih pengguna untuk memulai chat pribadi.</div>
      <div class="people-tools">
        <input id="searchPeople" type="search" placeholder="Cari nama atau email...">
        <button id="generalBtn" type="button">Chat umum</button>
      </div>
      <div id="peopleStatus" class="status">Memuat pengguna...</div>
      <div id="peopleList" class="people-list"></div>
    </div>

    <div id="privatePage" class="hidden" style="flex:1;min-height:0;flex-direction:column">
      <div class="chat-info" id="privateInfo">Chat pribadi</div>
      <div id="privateStatus" class="status"></div>
      <div id="privateMessages" class="messages"></div>
      <form id="privateForm" class="bottom">
        <input id="privateInput" type="text" placeholder="Ketik pesan..." maxlength="2000" autocomplete="off" required>
        <button type="submit" class="send" aria-label="Kirim">➤</button>
      </form>
    </div>

    <div id="generalPage" class="hidden" style="flex:1;min-height:0;flex-direction:column">
      <div class="chat-info">Chat umum · Masuk sebagai <b id="userName"></b></div>
      <div id="generalStatus" class="status"></div>
      <div id="generalMessages" class="messages"></div>
      <form id="generalForm" class="bottom">
        <input id="generalInput" type="text" placeholder="Ketik pesan..." maxlength="2000" autocomplete="off" required>
        <button type="submit" class="send" aria-label="Kirim">➤</button>
      </form>
    </div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,updateProfile} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import {getFirestore,collection,addDoc,query,orderBy,limit,onSnapshot,serverTimestamp,doc,setDoc} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB-uAsXsCILD1gshsEDueU__AP15bfVjv4",
  authDomain:"nyachatt-a262c.firebaseapp.com",
  projectId:"nyachatt-a262c",
  storageBucket:"nyachatt-a262c.firebasestorage.app",
  messagingSenderId:"1081303400744",
  appId:"1:1081303400744:web:981fd5f46c53eb2dce101d"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let isRegister=false,stopGeneral=null,stopPrivate=null,stopPeople=null,currentChatId=null,allPeople=[];

$("switchBtn").addEventListener("click",()=>{
  isRegister=!isRegister;
  $("name").classList.toggle("hidden",!isRegister);
  $("formTitle").textContent=isRegister?"Buat akun NyaChatt":"Silakan login ke akun kamu";
  $("submitBtn").textContent=isRegister?"Daftar":"Login";
  $("switchBtn").textContent=isRegister?"Sudah punya akun? Login":"Belum punya akun? Daftar";
  $("error").textContent="";
});
$("submitBtn").addEventListener("click",async()=>{
  const email=$("email").value.trim(),password=$("password").value,name=$("name").value.trim();
  $("error").textContent="";
  if(!email||!password){$("error").textContent="Email dan kata sandi wajib diisi.";return}
  if(isRegister&&!name){$("error").textContent="Nama wajib diisi.";return}
  if(isRegister&&password.length<6){$("error").textContent="Kata sandi minimal 6 karakter.";return}
  $("submitBtn").disabled=true;$("submitBtn").textContent="Memproses...";
  try{
    if(isRegister){
      const result=await createUserWithEmailAndPassword(auth,email,password);
      await updateProfile(result.user,{displayName:name});
      await setDoc(doc(db,"users",result.user.uid),{uid:result.user.uid,name,email,createdAt:serverTimestamp()});
    }else{await signInWithEmailAndPassword(auth,email,password)}
  }catch(e){
    const errors={"auth/email-already-in-use":"Email sudah terdaftar.","auth/invalid-email":"Format email tidak valid.","auth/weak-password":"Kata sandi terlalu lemah.","auth/invalid-credential":"Email atau kata sandi salah.","auth/network-request-failed":"Periksa koneksi internet."};
    $("error").textContent=errors[e.code]||"Terjadi kesalahan: "+e.message;
  }finally{$("submitBtn").disabled=false;$("submitBtn").textContent=isRegister?"Daftar":"Login"}
});

onAuthStateChanged(auth,async user=>{
  if(!user){
    stopAll();$("chatPage").classList.add("hidden");$("authPage").classList.remove("hidden");return;
  }
  $("authPage").classList.add("hidden");$("chatPage").classList.remove("hidden");
  $("userName").textContent=user.displayName||user.email;
  // Simpan profil agar akun lama juga muncul di daftar pengguna.
  try{await setDoc(doc(db,"users",user.uid),{uid:user.uid,name:user.displayName||user.email,email:user.email||"",updatedAt:serverTimestamp()},{merge:true})}
  catch(e){$("peopleStatus").textContent="Gagal menyiapkan profil: "+e.message}
  showPage("people");
  loadPeople();
});
function stopAll(){if(stopGeneral){stopGeneral();stopGeneral=null}if(stopPrivate){stopPrivate();stopPrivate=null}if(stopPeople){stopPeople();stopPeople=null}currentChatId=null}
function showPage(which){
  $("peoplePage").classList.toggle("hidden",which!=="people");
  $("privatePage").classList.toggle("hidden",which!=="private");
  $("generalPage").classList.toggle("hidden",which!=="general");
  $("privatePage").style.display=which==="private"?"flex":"none";
  $("generalPage").style.display=which==="general"?"flex":"none";
  $("headerTitle").textContent=which==="private"?$("privateInfo").dataset.title||"Chat pribadi":"NyaChatt 💬";\n  $("backBtn").classList.toggle("hidden",which!=="private");
}
function loadPeople(){
  if(stopPeople)stopPeople();
  $("peopleStatus").textContent="Memuat pengguna...";
  stopPeople=onSnapshot(query(collection(db,"users"),limit(200)),snap=>{
    allPeople=snap.docs.map(d=>d.data()).filter(p=>p.uid!==auth.currentUser?.uid);
    renderPeople();
    $("peopleStatus").textContent=allPeople.length?"Pilih pengguna di bawah.":"Belum ada pengguna lain. Minta teman mendaftar.";
  },e=>$("peopleStatus").textContent="Gagal memuat pengguna: "+e.message);
}
function renderPeople(){
  const term=$("searchPeople").value.trim().toLowerCase();
  const people=allPeople.filter(p=>(p.name||"").toLowerCase().includes(term)||(p.email||"").toLowerCase().includes(term));
  $("peopleList").innerHTML="";
  for(const p of people){
    const b=document.createElement("button");b.className="person";
    const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=(p.name||p.email||"?").slice(0,1).toUpperCase();
    const info=document.createElement("div");info.className="person-info";
    const name=document.createElement("div");name.className="person-name";name.textContent=p.name||"Pengguna";
    const email=document.createElement("div");email.className="person-email";email.textContent=p.email||"";
    info.append(name,email);b.append(avatar,info);b.addEventListener("click",()=>openPrivate(p));$("peopleList").appendChild(b);
  }
  if(!people.length&&allPeople.length){const e=document.createElement("div");e.className="empty";e.textContent="Pengguna tidak ditemukan."; $("peopleList").appendChild(e)}
}
$("searchPeople").addEventListener("input",renderPeople);
$("generalBtn").addEventListener("click",()=>{showPage("general");loadGeneral()});\n$("backBtn").addEventListener("click",()=>{if(stopPrivate){stopPrivate();stopPrivate=null}currentChatId=null;showPage("people")});
function openPrivate(person){
  const me=auth.currentUser;if(!me)return;
  const ids=[me.uid,person.uid].sort();
  currentChatId=ids.join("_");
  $("privateInfo").dataset.title=person.name||person.email||"Chat pribadi";
  $("privateInfo").textContent="Chat pribadi dengan "+(person.name||person.email||"Pengguna");
  showPage("private");
  loadPrivate(currentChatId);
}
function renderMessages(target,snapshot){
  target.innerHTML="";
  snapshot.forEach(d=>{
    const data=d.data(),box=document.createElement("div");
    box.className="message"+(data.uid===auth.currentUser?.uid?" mine":"");
    const text=document.createElement("div");text.className="message-text";text.textContent=data.text||"";
    const time=document.createElement("div");time.className="time";
    if(data.createdAt)time.textContent=data.createdAt.toDate().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
    box.append(text,time);target.appendChild(box);
  });
  target.scrollTop=target.scrollHeight;
}
function loadPrivate(chatId){
  if(stopPrivate)stopPrivate();
  $("privateStatus").textContent="Memuat pesan...";
  const me=auth.currentUser;
  const ids=chatId.split("_");
  setDoc(doc(db,"conversations",chatId),{members:ids,createdAt:serverTimestamp()},{merge:true}).catch(e=>$("privateStatus").textContent="Gagal membuka chat: "+e.message);
  stopPrivate=onSnapshot(query(collection(db,"conversations",chatId,"messages"),orderBy("createdAt","asc"),limit(200)),snap=>{
    renderMessages($("privateMessages"),snap);
    $("privateStatus").textContent=snap.empty?"Belum ada pesan. Mulai mengobrol!":"";
  },e=>$("privateStatus").textContent="Gagal memuat chat: "+e.message);
}
$("privateForm").addEventListener("submit",async e=>{
  e.preventDefault();const user=auth.currentUser,text=$("privateInput").value.trim(),chatId=currentChatId;
  if(!user||!text||!chatId)return;
  const btn=$("privateForm").querySelector("button");btn.disabled=true;
  try{
    await addDoc(collection(db,"conversations",chatId,"messages"),{uid:user.uid,name:user.displayName||user.email,text,createdAt:serverTimestamp()});
    $("privateInput").value="";$("privateInput").focus();
  }catch(err){$("privateStatus").textContent="Pesan gagal dikirim: "+err.message}
  finally{btn.disabled=false}
});
function loadGeneral(){
  if(stopGeneral)stopGeneral();
  $("generalStatus").textContent="Memuat pesan...";
  stopGeneral=onSnapshot(query(collection(db,"messages"),orderBy("createdAt","asc"),limit(100)),snap=>{
    renderMessages($("generalMessages"),snap);
    $("generalStatus").textContent=snap.empty?"Belum ada pesan. Mulai mengobrol!":"";
  },e=>$("generalStatus").textContent="Gagal memuat pesan: "+e.message);
}
$("generalForm").addEventListener("submit",async e=>{
  e.preventDefault();const user=auth.currentUser,text=$("generalInput").value.trim();if(!user||!text)return;
  const btn=$("generalForm").querySelector("button");btn.disabled=true;
  try{await addDoc(collection(db,"messages"),{uid:user.uid,name:user.displayName||user.email,text,createdAt:serverTimestamp()});$("generalInput").value=""}
  catch(err){$("generalStatus").textContent="Pesan gagal dikirim: "+err.message}
  finally{btn.disabled=false}
});
$("logoutBtn").addEventListener("click",async()=>{await signOut(auth)});
</script>
</body>
</html>
