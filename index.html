<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NyaChatt</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif
}

body{
  background:#e5ddd5;
  min-height:100vh
}

.app{
  max-width:500px;
  height:100dvh;
  margin:auto;
  background:#fff;
  display:flex;
  flex-direction:column
}

.header{
  background:#075e54;
  color:#fff;
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:21px;
  font-weight:bold;
  gap:10px
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0
}

.header-title{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.logout,.back{
  background:#128c7e;
  color:#fff;
  border:0;
  padding:10px;
  border-radius:8px
}

.back{font-size:18px}

.login-box{
  margin:auto;
  padding:25px;
  width:100%
}

.login-box h1{
  text-align:center;
  color:#075e54;
  margin-bottom:10px
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px
}

.login-box input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px
}

.primary{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#128c7e;
  color:#fff;
  font-size:17px;
  margin-bottom:12px
}

.switch{
  text-align:center;
  margin-top:10px;
  color:#075e54;
  cursor:pointer
}

.error{
  color:#c00;
  text-align:center;
  margin:10px 0;
  font-size:13px
}

.hidden{display:none!important}

#chatPage{
  height:100%;
  min-height:0;
  display:flex;
  flex-direction:column
}

#peoplePage{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column
}

.people-tools{
  padding:12px;
  background:#eee;
  display:flex;
  gap:8px
}

.people-tools input{
  flex:1;
  min-width:0;
  padding:12px;
  border:1px solid #ddd;
  border-radius:20px;
  font-size:15px
}

.people-tools button{
  border:0;
  border-radius:20px;
  padding:0 12px;
  background:#128c7e;
  color:white
}

.people-list{
  overflow-y:auto;
  flex:1;
  background:#fff
}

.person{
  width:100%;
  border:0;
  border-bottom:1px solid #eee;
  background:white;
  padding:14px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  color:#222
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#d9fdd3;
  color:#075e54;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:18px;
  flex-shrink:0
}

.person-info{min-width:0}

.person-name{
  font-weight:bold;
  margin-bottom:4px
}

.person-email{
  font-size:12px;
  color:#777;
  overflow:hidden;
  text-overflow:ellipsis
}

.empty{
  padding:20px;
  text-align:center;
  color:#777;
  font-size:14px
}

.chat-info{
  padding:10px 12px;
  background:#eee;
  font-size:13px
}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:15px;
  background:#efe7dd;
  display:flex;
  flex-direction:column;
  gap:10px
}

.message{
  max-width:80%;
  padding:10px 12px;
  border-radius:10px;
  background:white;
  align-self:flex-start;
  overflow-wrap:anywhere;
  box-shadow:0 1px 2px #0002
}

.message.mine{
  background:#d9fdd3;
  align-self:flex-end
}

.message-name{
  font-size:12px;
  font-weight:bold;
  color:#075e54;
  margin-bottom:5px
}

.message-text{
  font-size:15px;
  white-space:pre-wrap
}

.time{
  text-align:right;
  color:#777;
  font-size:10px;
  margin-top:5px
}

.bottom{
  padding:10px;
  background:#f0f0f0;
  display:flex;
  gap:8px
}

.bottom input{
  flex:1;
  min-width:0;
  padding:13px;
  border:0;
  border-radius:25px;
  outline:none;
  font-size:16px
}

.send{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#128c7e;
  color:white;
  font-size:20px
}

.status{
  text-align:center;
  color:#777;
  font-size:13px;
  padding:6px
}
</style>
</head>

<body>
<div class="app">

  <!-- HALAMAN LOGIN -->
  <div id="authPage" class="login-box">
    <h1>NyaChatt 💬</h1>

    <p class="subtitle" id="formTitle">
      Silakan login ke akun kamu
    </p>

    <input
      type="text"
      id="name"
      placeholder="Nama kamu"
      class="hidden"
      maxlength="40"
    >

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Kata sandi"
      autocomplete="current-password"
    >

    <p id="error" class="error"></p>

    <button id="submitBtn" class="primary">
      Login
    </button>

    <p id="switchBtn" class="switch">
      Belum punya akun? Daftar
    </p>
  </div>

  <!-- HALAMAN CHAT -->
  <div id="chatPage" class="hidden">

    <div class="header">
      <div class="header-left">
        <button
          id="backBtn"
          class="back hidden"
          type="button"
          aria-label="Kembali"
        >‹</button>

        <span class="header-title" id="headerTitle">
          NyaChatt 💬
        </span>
      </div>

      <button id="logoutBtn" class="logout">
        Logout
      </button>
    </div>

    <!-- DAFTAR PENGGUNA -->
    <div id="peoplePage">
      <div class="chat-info">
        Pilih pengguna untuk memulai chat pribadi.
      </div>

      <div class="people-tools">
        <input
          id="searchPeople"
          type="search"
          placeholder="Cari nama atau email..."
        >

        <button id="generalBtn" type="button">
          Chat umum
        </button>
      </div>

      <div id="peopleStatus" class="status">
        Memuat pengguna...
      </div>

      <div id="peopleList" class="people-list"></div>
    </div>

    <!-- CHAT PRIBADI -->
    <div
      id="privatePage"
      class="hidden"
      style="flex:1;min-height:0;flex-direction:column"
    >
      <div class="chat-info" id="privateInfo">
        Chat pribadi
      </div>

      <div id="privateStatus" class="status"></div>

      <div id="privateMessages" class="messages"></div>

      <form id="privateForm" class="bottom">
        <input
          id="privateInput"
          type="text"
          placeholder="Ketik pesan..."
          maxlength="2000"
          autocomplete="off"
          required
        >

        <button
          type="submit"
          class="send"
          aria-label="Kirim"
        >➤</button>
      </form>
    </div>

    <!-- CHAT UMUM -->
    <div
      id="generalPage"
      class="hidden"
      style="flex:1;min-height:0;flex-direction:column"
    >
      <div class="chat-info">
        Chat umum · Masuk sebagai
        <b id="userName"></b>
      </div>

      <div id="generalStatus" class="status"></div>

      <div id="generalMessages" class="messages"></div>

      <form id="generalForm" class="bottom">
        <input
          id="generalInput"
          type="text"
          placeholder="Ketik pesan..."
          maxlength="2000"
          autocomplete="off"
          required
        >

        <button
          type="submit"
          class="send"
          aria-label="Kirim"
        >➤</button>
      </form>
    </div>

  </div>
</div>
